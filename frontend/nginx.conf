server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression để tăng tốc độ load
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Xử lý React Router (SPA Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình proxy sang backend cho các đường dẫn /api
    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cấu hình cho Socket.IO
    location /socket.io/ {
        proxy_pass http://backend:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Cấu hình proxy cho thư mục uploads của backend
    location /uploads/ {
        proxy_pass http://backend:5001/uploads/;
        proxy_set_header Host $host;
    }

    # Chống truy cập file ẩn
    location ~ /\. {
        deny all;
    }
}
